name: Android checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build both languages and run regression tests
        run: bash gradlew assembleDeDebug assembleEnDebug testDeDebugUnitTest lintDeDebug --stacktrace
      - name: Summarize regression tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob("app/build/test-results/testDeDebugUnitTest/TEST-*.xml")
          totals = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
          for path in files:
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
              for failure in root.findall(".//failure"):
                  print(failure.text)
          print("Regression results:", totals)
          for path in glob.glob("app/build/reports/lint-results*.xml"):
              root = ET.parse(path).getroot()
              for issue in root.findall("issue"):
                  if issue.attrib.get("severity") in ("Error", "Fatal"):
                      print("Lint error:", issue.attrib, [location.attrib for location in issue.findall("location")])
          PY
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*
